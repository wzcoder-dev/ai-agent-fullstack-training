[project]
name = "guarded-harness"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "smolagents==1.26.0",
]

[project.optional-dependencies]
live = [
    "openai>=1,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
