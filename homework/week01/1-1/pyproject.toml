[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coding-agent"
version = "0.1.0"
description = "Week 01 作业 1-1：输入一个代码问题，通过 Agent Loop 输出一个可校验的修改计划"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["plan_agent*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
